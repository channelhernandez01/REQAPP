<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario Futurista REQAPP</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="page-shell">
    <section class="admin-access" aria-label="Panel de administración">
      <button type="button" id="admin-toggle" class="admin-toggle">Administración</button>
      <div id="admin-panel" class="admin-panel" hidden>
        <label class="field">
          <span>Contraseña de administradora</span>
          <input id="admin-password" type="password" autocomplete="current-password" />
        </label>
        <button type="button" id="admin-load">Ver solicitudes</button>
        <p id="admin-status" class="form-status" aria-live="polite"></p>
        <div id="admin-requests" class="admin-requests"></div>
      </div>
    </section>
    <header class="hero">
      <div class="hero-copy">
        <span class="eyebrow">Solicitud de proyecto</span>
        <h1>Formulario de cliente</h1>
        <p>Inicia tu proyecto con una propuesta hecha para ti.</p>
      </div>
      <div class="hero-chip">REQAPP</div>
    </header>

    <main class="layout">
      <section class="panel form-panel">
        <div class="panel-header">
          <h2>Tu información</h2>
          <p>Completa los campos para iniciar la solicitud.</p>
        </div>
        <form id="client-form" class="client-form">
          <div class="grid-2">
            <label class="field">
              <span>Nombre completo</span>
              <input type="text" name="name" placeholder="Ej. Maria López" required />
            </label>
            <label class="field">
              <span>Empresa</span>
              <input type="text" name="company" placeholder="Ej. Studio Futuro" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>Correo electrónico</span>
              <input type="email" name="email" placeholder="ejemplo@correo.com" required />
            </label>
            <label class="field">
              <span>Teléfono</span>
              <input type="tel" name="phone" placeholder="+34 600 123 456" />
            </label>
          </div>
          <label class="field">
            <span>Tipo de proyecto</span>
            <select name="projectType">
              <option value="web">Sitio web corporativo</option>
              <option value="ecommerce">Tienda en línea</option>
              <option value="landing">Landing page</option>
              <option value="app">Aplicación web</option>
              <option value="otro">Otro</option>
            </select>
          </label>
          <label class="field">
            <span>Descripción del proyecto</span>
            <textarea name="description" rows="5" placeholder="Describe los objetivos, público y servicios deseados"></textarea>
          </label>
          <div class="grid-2">
            <label class="field">
              <span>Presupuesto estimado</span>
              <input type="text" name="budget" placeholder="Ej. 3.000 - 5.000 USD" />
            </label>
            <label class="field">
              <span>Plazo deseado</span>
              <input type="text" name="deadline" placeholder="Ej. 2 meses" />
            </label>
          </div>
          <label class="field">
            <span>Logo de la compañía</span>
            <input type="file" name="companyLogo" accept="image/png,image/jpeg,image/svg+xml,image/webp" />
            <small class="field-help">Adjunta el logo en PNG, JPG, SVG o WebP.</small>
          </label>
          <label class="field">
            <span>Dirección</span>
            <input type="text" name="address" placeholder="Calle, ciudad, país" autocomplete="street-address" />
          </label>
          <fieldset class="field social-fields">
            <legend>Redes sociales</legend>
            <div class="grid-2">
              <label class="field">
                <span>TikTok</span>
                <input type="url" name="tiktok" placeholder="https://tiktok.com/@usuario" />
              </label>
              <label class="field">
                <span>Instagram</span>
                <input type="url" name="instagram" placeholder="https://instagram.com/usuario" />
              </label>
              <label class="field">
                <span>X (Twitter)</span>
                <input type="url" name="x" placeholder="https://x.com/usuario" />
              </label>
              <label class="field">
                <span>Facebook</span>
                <input type="url" name="facebook" placeholder="https://facebook.com/pagina" />
              </label>
            </div>
          </fieldset>
          <label class="field">
            <span>Archivos y recomendaciones</span>
            <input type="file" name="attachments" multiple />
            <small class="field-help">Adjunta referencias, documentos u opiniones que debamos considerar.</small>
          </label>
          <label class="field">
            <span>Recomendaciones u opiniones</span>
            <textarea name="feedback" rows="4" placeholder="Cuéntanos qué te gustaría mejorar o qué esperas del proyecto"></textarea>
          </label>
            <div class="form-actions">
            <button type="submit">Enviar solicitud</button>
          </div>
          <p class="hint">La solicitud se preparará para enviar a <strong>channelhernandez744@gmail.com</strong>.</p>
          <div id="form-status" class="form-status" aria-live="polite"></div>
        </form>
      </section>
    </main>
  </div>

  <script src="/script.js"></script>
</body>
</html>
